<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          // The stored setting is the authority; the OS preference only decides
          // 'system' and first load. Reading it here rather than after
          // hydration is what stops the wrong theme flashing on every load —
          // IndexedDB, where the setting actually lives, cannot be read
          // synchronously before paint, so App.tsx mirrors it to localStorage.
          var stored = null;
          try { stored = localStorage.getItem('theme'); } catch (e) {}

          // Match what App.tsx will apply, exactly: an explicit choice wins,
          // 'system' follows the OS, and nothing stored means the app's own
          // default of dark. Any other answer here is a flash.
          var prefersDark = !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          var isDark = stored === 'light' ? false : (stored === 'system' ? prefersDark : true);

          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(isDark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10161C" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TimeDoco" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TimeDoco — Application</title>
    <meta name="description" content="TimeDoco — a privacy-first, 100% client-side time tracker app. Track hours, generate professional client reports, and keep your data on your own device." />
    <link rel="canonical" href="https://timedoco.com/app/" />

    <!-- Open Graph -->
    <meta property="og:title" content="TimeDoco — Application" />
    <meta property="og:description" content="Track hours, generate professional client reports, and keep your data 100% on-device. No account, no server, no tracking." />
    <meta property="og:image" content="https://timedoco.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://timedoco.com/app/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->

    <meta name="twitter:title" content="TimeDoco — Application" />
    <meta name="twitter:description" content="Track hours, generate professional client reports, and keep your data 100% on-device." />
    <meta name="twitter:image" content="https://timedoco.com/og-image.png" />
  </head>

  </body>
