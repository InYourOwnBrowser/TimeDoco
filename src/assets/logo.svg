<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="100%" height="100%">
  <defs>
    <style>
      /* Default (Light Mode) Variables */
      :root {
        --bg-main: #10161C;
        --bg-muted: #EEF0EC;
        --text-time: #10161C;
      }

      /* Dark Mode Variables */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-main: #EEF0EC;
          --bg-muted: #26313A; /* Graphite tone for contrast in dark mode */
          --text-time: #EEF0EC;
        }
      }

      .adaptive-ink { fill: var(--bg-main); }
      .adaptive-stone { fill: var(--bg-muted); }
      .rust { fill: #B85C3E; }
      .rust-dim { fill: #8F452E; }

      .text-base {
        font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .time-text { fill: var(--text-time); }
      .doco-text { fill: #B85C3E; }
    </style>
  </defs>

  <!-- Row 1: Top grid cells and the rust document corner -->
  <rect x="10" y="10" width="18" height="18" rx="2" class="adaptive-ink" />
  <rect x="32" y="10" width="18" height="18" rx="2" class="adaptive-ink" />

  <!-- Rust Document Square with Dog-Eared Fold -->
  <polygon points="54,10 66,10 72,16 72,28 54,28" class="rust" />
  <polygon points="66,10 72,16 66,16" class="rust-dim" />

  <!-- Row 2: Adaptive stone cell paired with adaptive ink blocks -->
  <rect x="10" y="32" width="18" height="18" rx="2" class="adaptive-stone" />
  <rect x="32" y="32" width="18" height="18" rx="2" class="adaptive-ink" />
  <rect x="54" y="32" width="18" height="18" rx="2" class="adaptive-ink" />

  <!-- Row 3: Adaptive stone cells balancing the grid structure -->
  <rect x="10" y="54" width="18" height="18" rx="2" class="adaptive-stone" />
  <rect x="32" y="54" width="18" height="18" rx="2" class="adaptive-ink" />
  <rect x="54" y="54" width="18" height="18" rx="2" class="adaptive-stone" />

  <!-- Two-tone Brand Name (Adaptive Time text, Rust Doco) -->
  <text x="88" y="54" class="text-base">
    <tspan class="time-text">Time</tspan><tspan class="doco-text">Doco</tspan>
  </text>
</svg>
