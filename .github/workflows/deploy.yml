name: Deploy

# A push runs `verify` only. Deployment is deliberately manual — the `deploy`
# job is gated on `workflow_dispatch` — so landing on main or staging checks the
# code without shipping it. Removing the push trigger would leave both branches
# unverified, which is worse than the asymmetry.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

# Read-only by default, so a compromised dependency in a build step cannot push
# commits or move tags. The one job that needs more asks for it.
permissions:
  contents: read

# Supersede an in-flight verification when a newer commit lands on the same
# branch. The event name is part of the group so a push can never cancel a
# manual deploy that is part-way through publishing, and one deploy never
# cancels another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: License compliance check
        # Pinned: an unpinned `npx` fetches whatever is latest at run time, so a
        # gate on what may ship into the bundle could change without a commit.
        run: npx --yes license-checker@25.0.1 --production --failOn "GPL;AGPL;LGPL;SSPL;CC-BY-NC"
      - name: Dependency vulnerability check
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        # Drives the `dist/` the step above produced. These are the checks that
        # only exist in sequence — a deploy landing on an open tab, above all —
        # and no unit test can stand in for them.
        run: npx playwright test

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # wrangler-action records a GitHub deployment for the published site.
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=timedoco --branch=${{ inputs.target == 'production' && 'main' || 'staging' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
